<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Voice Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-2xl font-bold mb-4 text-center">Upload and Read PDF using Voice</h1>

    <input type="file" id="pdfFile" class="mb-4 w-full p-2 border rounded">
    <button onclick="uploadPDF()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded w-full mb-4">Upload</button>

    <button onclick="startListening()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded w-full">🎤 Start Voice Command</button>

    <p id="status" class="mt-4 text-gray-700 text-center"></p>
  </div>

  <script>
    let uploadedFileName = "";

    async function uploadPDF() {
      const fileInput = document.getElementById("pdfFile");
      const file = fileInput.files[0];
      if (!file || file.type !== "application/pdf") {
        alert("Please upload a valid PDF file.");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      const res = await fetch("/upload", {
        method: "POST",
        body: formData
      });

      const result = await res.json();
      if (res.ok) {
        uploadedFileName = result.filename;
        document.getElementById("status").innerText = "PDF uploaded successfully.";
      } else {
        document.getElementById("status").innerText = result.error;
      }
    }

    function startListening() {
      if (!('webkitSpeechRecognition' in window)) {
        alert("Speech recognition not supported in this browser.");
        return;
      }

      const recognition = new webkitSpeechRecognition();
      recognition.lang = "en-US";
      recognition.start();

      recognition.onresult = async function(event) {
        const transcript = event.results[0][0].transcript.toLowerCase();
        document.getElementById("status").innerText = `Heard: "${transcript}"`;

        if (transcript.includes("read the pdf")) {
          const response = await fetch("/read_pdf", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: uploadedFileName })
          });
          const data = await response.json();

          if (data.text) {
            speakText(data.text);
          } else {
            document.getElementById("status").innerText = "Error reading PDF.";
          }
        }
      };
    }

    function speakText(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
